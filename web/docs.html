<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moon's Pack</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css"
    />
    <link 
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <style>
      .markdown-body {
        box-sizing: border-box;
        min-width: 200px;
        max-width: 980px;
        margin: 0 auto;
        padding: 45px;
      }

      .markdown-body img {
        border-radius: 8px;
      }

      li#modrinth {
        list-style-type: none;
      }

      li#curseforge {
        list-style-type: none;
      }

      @media (max-width: 767px) {
        .markdown-body {
          padding: 15px;
        }
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #101411;
        }
      }

      .page-header {
        width: 100%;
        margin-bottom: 20px;
        overflow: auto;
      }

      .header-buttons {
        float: right;
        display: flex;
        gap: 12px;
      }

      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px;
        border-radius: 6px;
        text-decoration: none;
        transition: background-color 0.2s ease;
      }

      .icon-btn:hover {
        background-color: #232925;
      }

      #home {
        color: white;
        text-decoration: none; /* no underline */
      }

      .markdown-body table.custom-table {
        border-collapse: collapse;
      }

      .markdown-body table.custom-table th,
      .markdown-body table.custom-table td {
        border: none;
        padding: 6px 10px;
      }

      .markdown-body table.custom-table th {
        font-weight: 600;
        text-align: left;
      }

      .markdown-body table.custom-table td {
        vertical-align: middle;
      }

      .markdown-body table.custom-table td:first-child {
        width: 32px;
        text-align: center;
        padding-right: 8px;
      }

      .markdown-body table.custom-table td:first-child img {
        width: 32px;
        height: 32px;
        display: inline-block;
        vertical-align: middle;
        border-radius: 4px;
      }

      .markdown-body table.custom-table td:first-child .host-icon {
        width: 32px;
        height: 32px;
        display: inline-block;
        vertical-align: middle;
        margin-top: 6px;
        border-radius: 4px;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      marked.setOptions({
        gfm: true,
      });
    </script>
  </head>
  <body class="markdown-body">
    <header class="page-header">
      <div class="header-content">
        <div class="header-buttons">
          <a
            href="/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Home"
            title="Home"
            id="home"
            class="icon-btn"
          >
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#F2F5F3" class="bi bi-house-door-fill" viewBox="0 0 16 16">
            <path d="M6.5 14.5v-3.505c0-.245.25-.495.5-.495h2c.25 0 .5.25.5.5v3.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5"/>
          </svg>
          </a>
          <a
            href="https://github.com/jmcmahon1999/moons-pack"
            target="_blank"
            rel="noopener noreferrer"
            class="icon-btn"
            aria-label="Github Repository"
            title="Github Repository"
          >
            <img
              src="https://cdn.simpleicons.org/github/F2F5F3"
              width="20"
              height="20"
              alt="GitHub"
            />
          </a>

          <a
            href="https://github.com/jmcmahon1999/moons-pack/issues"
            target="_blank"
            rel="noopener noreferrer"
            class="icon-btn"
            aria-label="Github Issues"
            title="Github Issues"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              fill="#F2F5F3"
              class="bi bi-exclamation-triangle-fill"
              viewBox="0 0 16 16"
              aria-label="Github Issues"
            >
              <path
                d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"
              />
            </svg>
          </a>
        </div>
      </div>
    </header>

    <section id="help">
      <p>Loading Markdown…</p>
    </section>

    <section id="faq">
      <p>Loading Markdown…</p>
    </section>

    <script>
      marked.setOptions({ gfm: true });
      function loadMarkdown(md_path, md_id) {
        fetch(md_path)
          .then((r) => {
            if (!r.ok) throw new Error(`Failed to load ${md_path}`);
            return r.text();
          })
          .then((md) => {
            document.getElementById(md_id).innerHTML = marked.parse(md);
          })
          .catch((err) => {
            document.getElementById(md_id).innerHTML =
              `<p><em>${md_path} could not be loaded.</em></p>`;
            console.error(err);
          });
      }
      loadMarkdown("/web/docs/faq.md", "faq")
      loadMarkdown("/web/docs/help.md", "help")
      
      
    </script>

    </body>
</html>

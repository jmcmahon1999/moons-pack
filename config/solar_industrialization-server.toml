#Solar Industrialization configuration
[solar_industrialization]

	#Base EU generated per tick at peak efficiency (noon, no pollution)
	[solar_industrialization.generation]
		#LV Solar Panel
		# Default: 8
		# Range: 1 ~ 9223372036854775807
		lv_eu_per_tick = 8
		#MV Solar Panel
		# Default: 16
		# Range: 1 ~ 9223372036854775807
		mv_eu_per_tick = 16
		#HV Solar Panel
		# Default: 64
		# Range: 1 ~ 9223372036854775807
		hv_eu_per_tick = 64
		#EV Solar Panel
		# Default: 256
		# Range: 1 ~ 9223372036854775807
		ev_eu_per_tick = 256
		#SV Solar Panel
		# Default: 4096
		# Range: 1 ~ 9223372036854775807
		sv_eu_per_tick = 1024

	#Maximum EU storage capacity
	[solar_industrialization.storage]
		#LV Solar Panel
		# Default: 3200
		# Range: 1 ~ 9223372036854775807
		lv_max_storage = 3200
		#MV Solar Panel
		# Default: 12800
		# Range: 1 ~ 9223372036854775807
		mv_max_storage = 12800
		#HV Solar Panel
		# Default: 51200
		# Range: 1 ~ 9223372036854775807
		hv_max_storage = 51200
		#EV Solar Panel
		# Default: 102400
		# Range: 1 ~ 9223372036854775807
		ev_max_storage = 102400
		#SV Solar Panel
		# Default: 512000
		# Range: 1 ~ 9223372036854775807
		sv_max_storage = 512000

	#Pollution settings (ticks = game ticks; 24000 = 1 game day)
	[solar_industrialization.pollution]
		#Ticks to fully pollute in a normal biome
		# Default: 240000
		# Range: > 1
		ticks_normal = 240000
		#Ticks to fully pollute in a dry or cold biome
		# Default: 48000
		# Range: > 1
		ticks_harsh = 48000
		#Ticks to fully clean during rain
		# Default: 48000
		# Range: > 1
		rain_clean_ticks = 48000
		#Ticks to fully clean during thunderstorm
		# Default: 24000
		# Range: > 1
		thunder_clean_ticks = 24000

	#Solar filter upgrades — fraction of pollution rate that REMAINS (0.5 = 50% less pollution)
	[solar_industrialization.filters]
		#Basic Solar Filter
		# Default: 0.8
		# Range: 0.01 ~ 1.0
		basic = 0.8
		#Advanced Solar Filter
		# Default: 0.5
		# Range: 0.01 ~ 1.0
		advanced = 0.5
		#Elite Solar Filter
		# Default: 0.3
		# Range: 0.01 ~ 1.0
		elite = 0.3

	#Energy upgrade multipliers — EU/t multiplier applied per item in the upgrade slot
	[solar_industrialization.upgrades]
		#Basic Energy Upgrade
		# Default: 1.1
		# Range: 1.01 ~ 10.0
		basic = 1.1
		#Advanced Energy Upgrade
		# Default: 1.2
		# Range: 1.01 ~ 10.0
		advanced = 1.2
		#Elite Energy Upgrade
		# Default: 1.3
		# Range: 1.01 ~ 10.0
		elite = 1.3

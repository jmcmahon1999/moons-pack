<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moon's Pack</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">
  <style>
	.markdown-body {
		box-sizing: border-box;
		min-width: 200px;
		max-width: 980px;
		margin: 0 auto;
		padding: 45px;
	}

    li#modrinth {
        list-style-type: none;
    }

    li#curseforge {
        list-style-type: none;
    }

	@media (max-width: 767px) {
		.markdown-body {
			padding: 15px;
		}
	}


  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    marked.setOptions({
        gfm: true,
        breaks: false
    });
  </script>
</head>
<body class="markdown-body">

  <!-- Rendered Markdown goes here -->
  <section id="readme">
    <p>Loading README…</p>
  </section>

  <hr>
  <section>
    <h4>Project List</h4>
    <p>Credits to all the amazing developers of the following projects.</p>
    <table id="mod-list">
    <tbody>
      <tr><td colspan="4">Loading…</td></tr>
    </tbody>
  </table>
  </section>

  <!-- Any normal HTML content can go here -->
  

  <script>
    marked.setOptions({ gfm: true });
    fetch("/README.md")
      .then(r => {
        if (!r.ok) throw new Error("Failed to load README.md");
        return r.text();
      })
      .then(md => {
        document.getElementById("readme").innerHTML = marked.parse(md);
      })
      .catch(err => {
        document.getElementById("readme").innerHTML =
          "<p><em>README.md could not be loaded.</em></p>";
        console.error(err);
      });
  </script>

  <script type="module">
    import toml from 'https://cdn.jsdelivr.net/npm/toml@3.0.0/+esm'

    async function getAllVersions(mods) {
        console.log(mods);
        const modrinthMods = mods.filter((mod) => (mod?.host == "modrinth"))
        const mrVersionIds = modrinthMods.map(m => m.versionId)
        const mrQuery = encodeURIComponent(JSON.stringify(mrVersionIds))
        const response = await fetch(`https://api.modrinth.com/v2/versions?ids=${mrQuery}`)
        const json = await response.json()
        if (response.status == 200) return json;
    }

    async function getAllAuthors(mods) {
        const modrinthMods = mods.filter((mod) => (mod?.host == "modrinth"))
        const authorIds = [...new Set(modrinthMods.map(m => m.version.author_id))]
        const query = encodeURIComponent(JSON.stringify(authorIds))
        const response = await fetch(`https://api.modrinth.com/v2/users?ids=${query}`)
        if (response.status == 200) return await response.json()
    }

    async function loadMod(path) {
        try {
          const tomlText = await fetch(`/${path}`).then(r => r.text());
          const data = toml.parse(tomlText);

          const name = data.name;
          const modrinth = data?.update?.modrinth;
          const curseforge = data?.update?.curseforge;
          if (!!modrinth) {
            const modId = modrinth["mod-id"];
            const versionId = modrinth.version;
            return { 
                name: name,
                host: "modrinth",
                modId: modrinth["mod-id"],
                versionId: modrinth["version"],
                versionUrl: `https://modrinth.com/project/${modrinth["mod-id"]}`,
                url: `https://modrinth.com/project/${modrinth["mod-id"]}/version/${modrinth["version"]}`
            }
          }
          if (!!curseforge) {
            return { 
                name: name,
                host: "curseforge",
                modId: curseforge["project-id"],
                versionId: curseforge["file-id"],
                versionUrl: `https://modrinth.com/project/${curseforge["project-id"]}`,
                url: `https://modrinth.com/project/${curseforge["project-id"]}/version/${curseforge["file-id"]}`
            }
          }
          return { name: name }
        } catch (err) {
          console.warn(`Failed to process ${path}`, err);
        }
    }

    async function loadModIndex() {
      const tbody = document.querySelector("#mod-list tbody");

      // 1. Load the manifest
      const packText = await fetch("/index.toml").then(r => {
        if (!r.ok) throw new Error("Failed to load pack.toml");
        return r.text();
      });
      const pack = toml.parse(packText);

      if (!Array.isArray(pack.files)) {
        list.innerHTML = "<li>No files found.</li>";
        return;
      }

      // 2. Filter *.pw.toml entries
      const pwFiles = pack.files
        .map(f => f.file)
        .filter(f => f && f.endsWith(".pw.toml"));

      if (pwFiles.length === 0) {
        list.innerHTML = "<li>No .pw.toml files found.</li>";
        return;
      }

      const promises = []
      // 3. Fetch & parse each pw.toml
      for (const path of pwFiles) {
        promises.push(loadMod(path));
      }

      Promise.all(promises).then(async (mods) => {
        //mods = mods.filter((m) => !!m)
        const versions = new Map((await getAllVersions(mods)).map(v => [v.project_id, v]))
        console.log(versions);
        mods = mods.map(m => ({
            ...m,
            version: versions.get(m.modId) || {}
        }));
        const authors = new Map((await getAllAuthors(mods)).map(a => [a.id, a]))
        console.log(authors);
        mods = mods.map(m => ({
            ...m,
            author: authors.get(m.version.author_id) || {}
        }))
        console.log(mods);
        tbody.innerHTML = "";
        for (const mod of mods) {
            const tr = document.createElement("tr");

            const tdName = document.createElement("td");
            tdName.innerHTML = `<a href="${mod.url}" target="_blank" rel="noopener noreferrer">${mod.name}</a>`;

            const tdVersion = document.createElement("td");
            tdVersion.innerHTML = `<a href="${mod.versionUrl}" target="_blank" rel="noopener noreferrer">${mod.version.version_number ? mod.version.version_number : mod.versionId}</a>`;

            const tdAuthor = document.createElement("td");
            tdAuthor.textContent = mod.author?.username ?? "-";

            const tdHost = document.createElement("td");
            tdHost.innerHTML = `<img height="32" width="32" src="https://cdn.simpleicons.org/${mod.host}"/>`

            tr.append(tdHost, tdName, tdVersion, tdAuthor);
            tbody.appendChild(tr);
        }
      })
    }

    loadModIndex();
  </script>


</body>
</html>

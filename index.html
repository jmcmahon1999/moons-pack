<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>README</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>body{max-width:900px;margin:40px auto;font-family:sans-serif;line-height:1.5}</style>
</head>
<body>
  <div id="content">Loading…</div>
  <script>
    fetch("/README.md")
      .then(r => r.text())
      .then(md => { document.getElementById("content").innerHTML = marked.parse(md); })
      .catch(() => { document.getElementById("content").textContent = "Failed to load README.md"; });
  </script>
</body>
</html>

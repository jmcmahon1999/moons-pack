<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moon's Pack</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css"
    />
    <link 
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="/web/style.css"
    />
  </head>
  <body class="markdown-body">
    <header class="page-header">
      <div class="header-content">
        <div class="header-buttons">
          <a
            href="https://github.com/jmcmahon1999/moons-pack/releases"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Current Version"
            title="Current Version"
            id="current-version"
            class="icon-btn"
          >
          </a>
          <a
            href="/docs"
            target="_blank"
            rel="noopener noreferrer"
            class="icon-btn"
            aria-label="Documentation"
            title="Documentation"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              fill="#F2F5F3"
              class="bi bi-file-text-fill"
              viewBox="0 0 16 16"
            >
              <path d="M12 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2M5 4h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1 0-1m-.5 2.5A.5.5 0 0 1 5 6h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1-.5-.5M5 8h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1 0-1m0 2h3a.5.5 0 0 1 0 1H5a.5.5 0 0 1 0-1"/>
            </svg>
          </a>
          <a
            href="https://github.com/jmcmahon1999/moons-pack"
            target="_blank"
            rel="noopener noreferrer"
            class="icon-btn"
            aria-label="Github Repository"
            title="Github Repository"
          >
            <img
              src="https://cdn.simpleicons.org/github/F2F5F3"
              width="20"
              height="20"
              alt="GitHub"
            />
          </a>

          <a
            href="https://github.com/jmcmahon1999/moons-pack/issues"
            target="_blank"
            rel="noopener noreferrer"
            class="icon-btn"
            aria-label="Github Issues"
            title="Github Issues"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              fill="#F2F5F3"
              class="bi bi-exclamation-triangle-fill"
              viewBox="0 0 16 16"
              aria-label="Github Issues"
            >
              <path
                d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"
              />
            </svg>
          </a>
        </div>
      </div>
    </header>

    <section id="banner">
      <img src="/web/banner.png">
    </section>

    <section id="readme">
      <p>Loading README…</p>
    </section>

    <hr />
    <section>
      <h2><a name="project-list"></a>Project List</h2>
      <p>Credits to all the amazing developers of the following projects.</p>
      <table id="mod-list" class="custom-table">
        <tbody>
          <tr>
            <td colspan="4">Loading…</td>
          </tr>
        </tbody>
      </table>
    </section>

    <script type="module">
      import { loadMarkdown, getPackVersion, buildProjectList } from '/web/frontend.js';
      loadMarkdown("/README.md", "readme");
      getPackVersion();
      buildProjectList();
    </script>

  </body>
</html>
